name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify:
    name: Verify Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --ci --runInBand

  build-android-and-release:
    name: Build Android APK & Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release artifacts
        run: |
          TAG_NAME="${{ steps.tag.outputs.name }}"
          APK_NAME="klearn-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_file=${APK_NAME}" >> "$GITHUB_OUTPUT"
        id: artifacts

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG_VERSION="${{ steps.tag.outputs.name }}"
          VERSION_NUM="${TAG_VERSION#v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${VERSION_NUM}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TAG_VERSION} of Klearn." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Klearn ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk_file }}
            ${{ steps.artifacts.outputs.apk_file }}.sha256
